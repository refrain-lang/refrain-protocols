name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require private Refrain read access
        env:
          REFRAIN_READ_TOKEN: ${{ secrets.REFRAIN_READ_TOKEN }}
        run: |
          if [ -z "$REFRAIN_READ_TOKEN" ]; then
            echo "::error::Set REFRAIN_READ_TOKEN with read-only access to refrain-lang/refrain"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: refrain-lang/refrain
          ref: 03191687652009976aad8215bf7ce9b020cdb8c0
          token: ${{ secrets.REFRAIN_READ_TOKEN }}
          path: refrain-source
          persist-credentials: false
      - name: Install refrain + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ./refrain-source
          pip install pytest jsonschema maturin
      - uses: dtolnay/rust-toolchain@stable
      - name: Build matching Rust evaluator for parity tests
        run: |
          maturin build --release -m refrain-source/refrain-core/Cargo.toml --out dist
          pip install dist/refrain_core*.whl
      - name: Rebuild catalog (must match committed)
        run: |
          python tools/build_catalog.py
          git diff --exit-code catalog.json || (echo "::error::catalog.json is stale — run tools/build_catalog.py and commit" && exit 1)
      - name: Validate (parse + meta schema + catalog)
        run: pytest -q tests/

  # Behavioural gate. `validate` proves each protocol parses and carries valid
  # metadata; this proves the engine actually behaves as the protocol claims.
  # The fuzzer synthesizes EEG with known spectral content, predicts the
  # expected evaluator behaviour independently of the evaluator, runs it, and
  # asserts they agree — plus noise-robust metamorphic sweeps for the
  # percentile protocols, whose firing is decided by the noise realization.
  #
  # The seed is FIXED so a failure is reproducible: `refrain fuzz protocols/
  # --library lib --seed 42` locally reproduces exactly what CI saw.
  #
  # Exit-code contract: violations and errored protocols fail the build; a
  # protocol whose shape the fuzzer cannot yet represent is a typed SKIP and
  # does NOT. The skip breakdown is printed in the log — as of refrain
  # v0.14.0 the corpus fuzzes 26/38 with 0 violations, and the 12 skips are
  # coverage gaps in the fuzzer (composite-signal and coherence rewards
  # mostly), not failures here.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require private Refrain read access
        env:
          REFRAIN_READ_TOKEN: ${{ secrets.REFRAIN_READ_TOKEN }}
        run: |
          if [ -z "$REFRAIN_READ_TOKEN" ]; then
            echo "::error::Set REFRAIN_READ_TOKEN with read-only access to refrain-lang/refrain"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: refrain-lang/refrain
          ref: 03191687652009976aad8215bf7ce9b020cdb8c0
          token: ${{ secrets.REFRAIN_READ_TOKEN }}
          path: refrain-source
          persist-credentials: false
      - name: Install refrain
        run: |
          python -m pip install --upgrade pip
          pip install ./refrain-source
      - name: Fuzz the corpus (structural + sample-exact + metamorphic tiers)
        run: |
          set -eu
          # A research-grade amp that declares every operant site (Cz/Fz/Pz/C3/C4 + ears),
          # so every amp-reading protocol resolves. (A consumer amp like BrainBit
          # can't host all sites — that's WOR-163's full-amp matrix, not this gate.)
          AMP="$(python -c 'import refrain,os;print(os.path.join(os.path.dirname(refrain.__file__),"amp_profiles","q21.json"))')"
          # Literal protocols (no amp.<field> reference) — resolve at amp=None.
          # The [a-z_] after the dot avoids matching prose like "...research amp.".
          LITERAL="$(grep -rLE --include='*.refrain' '\bamp\.[a-z_]' protocols || true)"
          if [ -n "$LITERAL" ]; then
            echo "Fuzzing literal protocols at amp=None"
            refrain fuzz $LITERAL --library lib --seed 42
          fi
          # Amp-reading protocols — resolve against the research-grade amp above.
          READERS="$(grep -rlE --include='*.refrain' '\bamp\.[a-z_]' protocols || true)"
          if [ -n "$READERS" ]; then
            echo "Fuzzing amp-reading protocols with --amp q21"
            refrain fuzz $READERS --library lib --amp "$AMP" --seed 42
          fi
