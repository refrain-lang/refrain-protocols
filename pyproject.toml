[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refrain-protocols"
version = "0.3.0"
description = "Reference neurofeedback & HRV protocol library for Refrain (draft set)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
]
# v0.25.1 is the floor. The v0.24.0 reasons still hold: it changed the
# coherence segment length (nperseg 188 -> 125 at 250 Hz) that alpha_coherence
# depends on, so an older refrain would resolve that file and run it with
# different numbers, and the protocol redesigns use band_envelope (IR-JSON
# v0.5), which 0.24.0 ships.
#
# v0.25.1 adds the primitives the spindle protocol's hold fix needs: a dip
# `tolerance` on dwell / dwell_rearm / hold_for, and a `kind` label on inhibits
# so an artifact mute freezes a hold's accumulator instead of resetting it.
#
# Raised AHEAD of the file that needs it, on purpose. No protocol in this
# repository declares either field today, and because the IR-0.6 version
# predicate is behavioural -- it reports "0.6" only when a hold's baked
# `tolerance_samples` is at least 1 -- every file here still resolves and runs
# correctly on a 0.24 engine. So this floor is not yet load-bearing; it is in
# place so it is already true when the hold fix lands, rather than moving the
# floor and the signal path in one change. Raising it with that change instead
# would have been equally defensible.
dependencies = [
  "refrain >= 0.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest >= 7.0",
  "jsonschema >= 4.0",
]

# Ship the protocol files + the catalog so a host can `pip install refrain-protocols`
# and read them from the installed package.
[tool.hatch.build.targets.wheel]
only-include = ["protocols", "drafts", "lib", "schema", "catalog.json"]

[tool.hatch.build.targets.wheel.sources]
"" = "refrain_protocols"
