[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refrain-protocols"
version = "0.2.0"
description = "Reference neurofeedback & HRV protocol library for Refrain (draft set)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
]
# v0.24.0 is the floor: it changed the coherence segment length (nperseg
# 188 -> 125 at 250 Hz) that alpha_coherence depends on, so an older refrain
# would resolve that file and run it with different numbers; and the coming
# protocol redesigns use band_envelope (IR-JSON v0.5), which 0.24.0 ships.
dependencies = [
  "refrain >= 0.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest >= 7.0",
  "jsonschema >= 4.0",
]

# Ship the protocol files + the catalog so a host can `pip install refrain-protocols`
# and read them from the installed package.
[tool.hatch.build.targets.wheel]
only-include = ["protocols", "drafts", "lib", "schema", "catalog.json"]

[tool.hatch.build.targets.wheel.sources]
"" = "refrain_protocols"
