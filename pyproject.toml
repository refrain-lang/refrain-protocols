[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refrain-protocols"
version = "0.1.0"
description = "Reference neurofeedback & HRV protocol library for Refrain (draft set)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
]
# Reading protocol metadata needs refrain (parse-only). Pinned to v0.22.0,
# which adds the autopilot grammar (named reward checks via `as "name"`, the
# `autopilot { }` section, and per-control `autopilot = ...` policies) that
# protocols/eeg/alpha_theta.refrain now uses (v1.3.0) — an older refrain
# can't even PARSE that file, so this floor is load-bearing for the whole
# distributed set, not just alpha_theta.
dependencies = [
  "refrain >= 0.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest >= 7.0",
  "jsonschema >= 4.0",
]

# Ship the protocol files + the catalog so a host can `pip install refrain-protocols`
# and read them from the installed package.
[tool.hatch.build.targets.wheel]
only-include = ["protocols", "drafts", "lib", "schema", "catalog.json"]

[tool.hatch.build.targets.wheel.sources]
"" = "refrain_protocols"
